services:
  - type: web
    name: epam-ai-vacancies
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn service.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: HOST
        value: "0.0.0.0"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CF_ANALYTICS_TOKEN
        sync: false
      - key: STATS_TOKEN
        sync: false
