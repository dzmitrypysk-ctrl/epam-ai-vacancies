name: Keep Render warm

on:
  schedule:
    # Render free tier sleeps after ~15m idle; ping often enough to stay warm.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Warm health + llms.txt
        run: |
          set -e
          BASE="https://epam-ai-vacancies.onrender.com"
          curl -fsS --retry 2 --retry-delay 5 --max-time 90 "$BASE/health"
          echo
          curl -fsS --retry 2 --retry-delay 5 --max-time 90 -o /dev/null -w "llms=%{http_code} t=%{time_total}s\n" "$BASE/llms.txt"
